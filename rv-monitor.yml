name: Texas A&M RV Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tamu-rv-monitor-main
  cancel-in-progress: false

jobs:
  check-rv-exchanges:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check both RV exchanges
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rv_monitor.py

      - name: Save monitor state
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "No state.json to save."
            exit 0
          fi

          git config user.name "rv-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "Update RV monitor state"
          git pull --rebase origin main
          git push origin HEAD:main
